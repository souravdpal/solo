<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo Leveling - Login</title>
  <link rel="stylesheet" href="/css/login.css">
  <link rel="icon" type="image/x-icon" href="/assets/images/solo.png">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="dashboard-container">
    <h1 class="title">LOGIN <span>🔑</span></h1>
    <form id="login-form" method="POST" action="/login">
      <input type="text" id="username" name="username" placeholder="Username" required>
      <input type="password" id="password" name="password" placeholder="Password (min 6 chars)" required minlength="6">
      <button type="submit" class="btn">LOGIN</button>
    </form>
    <p>Don't have an account? <a href="/signup.html">Sign Up</a></p>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
