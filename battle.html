<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo Leveling - Battle</title>
  <link rel="stylesheet" href="/css/battle.css">
  <link rel="icon" type="image/x-icon" href="/assets/images/solo.png">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="battle-container">
    <h1 class="title">BATTLE <span>⚔️</span></h1>
    <div id="user-stats" class="stats">
      <p><strong>Username:</strong> <span id="username"></span></p>
      <p><strong>XP:</strong> <span id="xp">0</span></p>
      <p><strong>Rank:</strong> <span id="rank">E-Rank</span></p>
      <p><strong>Coins:</strong> <span id="coins">100</span></p>
    </div>
    <button id="battle-btn" class="btn">Start Battle</button>
    <div id="battle-result" class="result"></div>
  </div>
  <script src="/js/battle.js"></script>
</body>
</html>
