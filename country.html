<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="assets/images/solo.png" type="image/svg+xml">

  <link rel="icon" href="/favicon.png" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo Leveling - Country</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/country.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Select Your Country</h1>
    </header>
    <div class="country-section">
      <select id="country-select" class="country-select" required>
        <option value="">Select Your Country</option>
      </select>
      <button id="save-country" class="btn">Save Country</button>
      <div id="country-display" class="country-display"></div>
    </div>
    <button id="back-to-profile" class="btn">Back to Profile</button>
  </div>
  <script src="js/country.js"></script>
</body>
</html>
