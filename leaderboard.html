<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta charset="UTF-8">
  <link rel="icon" href="assets/images/solo.png" type="image/svg+xml">

  <link rel="icon" href="/favicon.png" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo Leveling - Leaderboard</title>
  <link rel="stylesheet" href="/css/leaderboard.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

<body>
  <div id="leaderboard-container" class="leaderboard-container">
    <h1 class="title">TOP HUNTERS <span>⚡</span></h1>

      <input type="text" id="search-input" class="search-input" placeholder="Search hunters...">

    <div class="leaderboard-card">
      <h2>Top Hunters</h2>
      <ul id="leaderboard-list" class="leaderboard-list"></ul>
    </div>
  </div>
  <script src="/js/leaderboard.js"></script>
