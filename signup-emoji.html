<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="assets/images/solo.png" type="image/svg+xml">

  <link rel="icon" href="/favicon.png" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rise, Hunter - Signup with Unicode</title>
  <link rel="stylesheet" href="/css/signup-emoji.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="signup-container" class="signup-container">
    <div id="signup-card" class="signup-card">
      <h2>Signup with Unicode</h2>
      <form id="signup-form" method="POST" action="/signup-emoji">
        <input type="text" id="username" name="username" class="signup-input" placeholder="Username" required>
        <input type="password" id="password" name="password" class="signup-input" placeholder="Password" required>
        <select id="country" name="country" class="signup-input" required>
          <option value="" disabled selected>Select Country</option>
          <option value="\ud83c\uddfa\ud83c\uddf8">United States (🇺🇸)</option>
          <option value="\ud83c\uddee\ud83c\uddf3">India (🇮🇳)</option>
          <option value="\ud83c\uddec\ud83c\udde7">United Kingdom (🇬🇧)</option>
          <option value="\ud83c\uddef\ud83c\uddf5">Japan (🇯🇵)</option>
          <option value="\ud83c\uddf0\ud83c\uddf7">South Korea (🇰🇷)</option>
          <option value="\ud83c\udde8\ud83c\uddf3">China (🇨🇳)</option>
          <option value="\ud83c\uddeb\ud83c\uddf7">France (.Diagnostics
          <option value="\ud83c\udde9\ud83c\uddea">Germany (🇩🇪)</option>
          <option value="\ud83c\udde8\ud83c\udde6">Canada (🇨🇦)</option>
          <option value="\ud83c\udde6\ud83c\uddfa">Australia (🇦🇺)</option>
          <option value="\ud83c\uddf9\ud83c\udde8">Turks and Caicos Islands (🇹🇨)</option>
          <option value="\ud83c\uddf9\ud83c\udde9">Chad (🇹🇩)</option>
          <option value="\ud83c\uddf9\ud83c\uddec">Togo (🇹🇬)</option>
          <option value="\ud83c\uddf9\ud83c\udded">Thailand (🇹🇭)</option>
          <option value="\ud83c\uddf9\ud83c\uddef">Tajikistan (🇹🇯)</option>
          <option value="\ud83c\uddf9\ud83c\uddf0">Tokelau (🇹🇰)</option>
          <option value="\ud83c\uddf9\ud83c\uddf2">Turkmenistan (🇹🇲)</option>
          <option value="\ud83c\uddf9\ud83c\uddf1">Timor-Leste (🇹🇱)</option>
          <option value="\ud83c\uddf9\ud83c\uddf4">Tonga (🇹🇴)</option>
          <option value="\ud83c\uddf9\ud83c\uddf9">Trinidad and Tobago (🇹🇹)</option>
          <option value="\ud83c\uddf9\ud83c\uddf3">Tunisia (🇹🇳)</option>
          <option value="\ud83c\uddf9\ud83c\uddf7">Turkey (🇹🇷)</option>
          <option value="\ud83c\uddf9\ud83c\uddfb">Tuvalu (🇹🇻)</option>
          <option value="\ud83c\uddf9\ud83c\uddfc">Taiwan (🇹🇼)</option>
        </select>
        <button type="submit" id="signup-btn" class="btn">Signup</button>
      </form>
      <p id="login-link">Already have an account? <a href="/login.html">Login</a></p>
      <p id="error-message" class="error-message hidden"></p>
    </div>
  </div>
  <script src="/js/signup-emoji.js"></script>
</body>
</html>
