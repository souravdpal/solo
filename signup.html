<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <link rel="icon" href="assets/images/solo.png" type="image/svg+xml">

    <link rel="icon" href="/favicon.png" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>redirecting!</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
   <script>window.location.href = 'signup-emoji.html';</script>
   <noscript>Please enable JavaScript to proceed.</noscript>    
   <script>
        // Redirect to signup-emoji.html if JavaScript is enabled
        if (document.readyState === 'complete') {
            window.location.href = 'signup-emoji.html';
        } else {
            document.addEventListener('DOMContentLoaded', function() {
                window.location.href = 'signup-emoji.html';
            });
        }
   </script> 
</body>
</html>
